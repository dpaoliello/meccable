[package]
name = "meccable"
version = "0.1.0"
edition = "2024"
authors = ["Daniel Paoliello <daniel@meta-sys.info>"]
description = "A Rust library and CLI tool to control Meccanoid robots over Bluetooth."
license = "MIT"

[dependencies]
anyhow = "1"
btleplug = "0.11"
tokio = { version = "1", features = ["full"] }
strum = { version = "0.27", features = ["derive"] }
uuid = "1.0"
