[package]
name = "meccable"
version = "0.1.0"
edition = "2024"
authors = ["Daniel Paoliello <daniel@meta-sys.info>"]
description = "A Rust library and CLI tool to control Meccanoid robots over Bluetooth."
license = "MIT"

[dependencies]
anyhow.workspace = true
btleplug = "0.11"
strum = { version = "0.27", features = ["derive"] }
tokio.workspace = true
uuid = "1.0"
